<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>東京都ムービーメーカー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic",sans-serif;background:#eef5ff;color:#17324d}
button{font:inherit}
.hidden{display:none!important}

#app{width:100%;height:100%;position:relative}
.screen{position:absolute;inset:0;padding:18px;overflow:auto}
h1,h2,p{margin:.3em 0}
.title{font-size:clamp(28px,4vw,52px);font-weight:900}
.sub{font-size:clamp(16px,2vw,24px)}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.homeBtn,.smallBtn,.mainBtn{
  border:0;border-radius:18px;padding:12px 20px;font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 #b6c6d8;background:white;color:#17324d
}
.mainBtn{font-size:clamp(20px,2.5vw,30px);padding:14px 28px;background:#ffe36e}
.mainBtn:active,.homeBtn:active,.smallBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b6c6d8}

#home{background:linear-gradient(#dff3ff,#f8fbff)}
.homeTitle{text-align:center;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1100px;margin:28px auto}
.menuCard{
  min-height:260px;border:0;border-radius:28px;padding:22px;cursor:pointer;font-weight:900;
  box-shadow:0 10px 0 rgba(0,0,0,.12);position:relative;overflow:hidden
}
.menuCard .num{font-size:clamp(28px,4vw,48px)}
.menuCard .name{font-size:clamp(24px,3vw,40px);margin-top:16px}
.menuCard .status{position:absolute;right:14px;top:14px;background:white;border-radius:999px;padding:8px 14px;font-size:18px}
.city{background:#ffe3d5}.green{background:#dff5d9}.sea{background:#d9f0ff}
#finalArea{text-align:center;margin:10px auto;max-width:800px;padding:18px;border-radius:24px;background:#fff;box-shadow:0 6px 20px #0001}

#builder{background:#f9fbfd}
.builderWrap{max-width:1100px;margin:auto}
.progress{display:flex;gap:10px;justify-content:center;margin:8px 0 18px}
.dot{width:18px;height:18px;border-radius:50%;background:#c9d3dd}
.dot.on{background:#ffbf3f}
.questionBox{
  background:white;border-radius:28px;padding:24px;box-shadow:0 8px 28px #0001;text-align:center
}
.fixedText{font-size:clamp(24px,3vw,42px);font-weight:900;margin:8px 0 18px}
.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.choiceGrid.two{grid-template-columns:repeat(2,1fr);max-width:700px;margin:auto}
.choice{
  border:5px solid transparent;background:#f3f6f9;border-radius:22px;padding:10px;cursor:pointer;
  min-height:170px;font-weight:900;font-size:clamp(18px,2.2vw,28px);display:flex;flex-direction:column;justify-content:center;align-items:center
}
.choice img{width:100%;height:120px;object-fit:cover;border-radius:14px;background:#dfe7ef}
.choice.selected{border-color:#ffb000;background:#fff7cf;transform:scale(1.02)}
.choice.textChoice{min-height:130px;font-size:clamp(30px,4vw,52px)}
.navrow{display:flex;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap}
.notice{font-size:18px;color:#5b6f83;margin-top:12px}

#movie{padding:0;background:#000;color:white;overflow:hidden}
#movieStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bgImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.78);animation:slowZoom 10s linear forwards}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.overlay{position:absolute;inset:0;background:linear-gradient(transparent,#0008)}
.movieText{position:relative;z-index:2;text-align:center;font-weight:900;text-shadow:0 4px 10px #000;font-size:clamp(30px,5vw,72px);padding:20px}
.movieSub{font-size:clamp(20px,3vw,36px);display:block;margin-top:15px}
.bigWord{font-size:clamp(60px,10vw,140px);animation:pop .6s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}75%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.fadeIn{animation:fade .7s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slideUp{animation:slideUp .7s both}
@keyframes slideUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}

.glitch{animation:glitch .12s infinite;background:#150000}
@keyframes glitch{
  0%{transform:translate(0)}25%{transform:translate(-8px,4px)}50%{transform:translate(8px,-5px)}75%{transform:translate(-5px,-4px)}100%{transform:translate(0)}
}
.errorText{font-size:clamp(48px,8vw,120px);color:#ff4a4a;text-shadow:4px 4px #00d9ff,-4px -3px #fff}
#movieControls{position:absolute;z-index:10;right:14px;bottom:14px;display:flex;gap:10px}
#movieControls button{background:#ffffffdd;border:0;border-radius:999px;padding:10px 16px;font-weight:900}

.completeBurst{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#fff7b0 0,#ffcf54 45%,#ff9d4c 100%);color:#5b2e00;text-align:center
}
.completeBurst h2{font-size:clamp(44px,7vw,96px)}
.finalGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:90vw;max-width:1000px}
.finalGrid img{width:100%;height:42vh;object-fit:cover;border-radius:18px;background:#dfe7ef}
.finalItem{position:relative;background:#fff;border-radius:18px;overflow:hidden;min-height:42vh;display:flex;align-items:center;justify-content:center;color:#17324d;font-weight:900;font-size:clamp(20px,2.4vw,34px);text-align:center;padding:14px}
.finalItem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finalItem .label{position:absolute;left:10px;right:10px;bottom:10px;background:#ffffffdd;color:#17324d;border-radius:12px;padding:8px;z-index:2}
.placeholder{background:repeating-linear-gradient(45deg,#e7eef6,#e7eef6 16px,#f7fbff 16px,#f7fbff 32px)}


/* ===== 派手派手バリエーション演出 ===== */
.heroWord{
  font-size:clamp(110px,20vw,260px)!important;
  line-height:.85;
  letter-spacing:.02em;
  font-weight:1000;
  text-shadow:0 10px 24px #0009,0 0 30px #fff8;
}
.zoomBurst{animation:zoomBurst .72s cubic-bezier(.14,1.5,.35,1) both}
@keyframes zoomBurst{
  0%{transform:scale(.01) rotate(-15deg);opacity:0}
  65%{transform:scale(1.35) rotate(4deg);opacity:1}
  100%{transform:scale(1) rotate(0)}
}
.flyLeft{animation:flyLeft .8s cubic-bezier(.15,.9,.2,1) both}
@keyframes flyLeft{from{transform:translateX(-130vw) rotate(-14deg) scale(.65);opacity:0}to{transform:none;opacity:1}}
.flyRight{animation:flyRight .8s cubic-bezier(.15,.9,.2,1) both}
@keyframes flyRight{from{transform:translateX(130vw) rotate(14deg) scale(.65);opacity:0}to{transform:none;opacity:1}}
.dropIn{animation:dropIn .75s cubic-bezier(.15,1.2,.25,1) both}
@keyframes dropIn{0%{transform:translateY(-120vh) rotate(10deg) scale(.5);opacity:0}70%{transform:translateY(22px) rotate(-3deg) scale(1.08);opacity:1}100%{transform:none}}
.spinCard{animation:spinCard .9s cubic-bezier(.15,.9,.2,1) both}
@keyframes spinCard{0%{transform:perspective(900px) rotateY(110deg) rotateZ(-10deg) scale(.45);opacity:0}100%{transform:perspective(900px) rotateY(0) rotateZ(0) scale(1);opacity:1}}
.wipeImage{clip-path:inset(0 100% 0 0);animation:wipeOpen .85s cubic-bezier(.15,.9,.2,1) forwards}
@keyframes wipeOpen{to{clip-path:inset(0 0 0 0)}}
.diagonalImage{clip-path:polygon(0 0,0 0,0 100%,0 100%);animation:diagOpen .9s cubic-bezier(.15,.9,.2,1) forwards}
@keyframes diagOpen{to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
.floatText{animation:floatText .9s ease-out both}
@keyframes floatText{0%{transform:translateY(120px) scale(.65);opacity:0}65%{transform:translateY(-16px) scale(1.08);opacity:1}100%{transform:none}}
.waveText{animation:waveText .9s cubic-bezier(.15,.9,.2,1) both}
@keyframes waveText{0%{transform:translateY(120px) rotate(-10deg) scale(.7);opacity:0}60%{transform:translateY(-14px) rotate(4deg) scale(1.08);opacity:1}100%{transform:none}}
.cityFlash{background:linear-gradient(135deg,#171717,#5d6b7e)}
.greenFlash{background:radial-gradient(circle at 50% 70%,#f1ffe8,#68b85d)}
.seaFlash{background:linear-gradient(#61d2ff,#0065a5)}
.ribbon{
  position:absolute;left:-10%;right:-10%;top:50%;transform:translateY(-50%) rotate(-3deg);
  background:#fff9;padding:16px 0;backdrop-filter:blur(4px)
}

/* 9 scene-specific image motions */
.fx-city-1{animation:cityTower 4.3s cubic-bezier(.12,.85,.2,1) both}
@keyframes cityTower{
  0%{transform:scale(.22) rotate(-9deg) translateY(60vh);filter:brightness(2) blur(8px)}
  28%{transform:scale(1.28) rotate(3deg) translateY(-3vh);filter:brightness(1.2) blur(0)}
  55%{transform:scale(.96) rotate(-1deg)}
  100%{transform:scale(1.12) rotate(0)}
}
.fx-city-2{animation:cityRush 4.3s cubic-bezier(.16,.8,.18,1) both}
@keyframes cityRush{
  0%{transform:translateX(120vw) scale(1.6) skewX(-12deg);filter:contrast(1.8)}
  45%{transform:translateX(-5vw) scale(.92) skewX(4deg)}
  65%{transform:translateX(2vw) scale(1.08) skewX(-2deg)}
  100%{transform:translateX(0) scale(1.18) skewX(0)}
}
.fx-city-3{animation:cityPostcard 4.3s cubic-bezier(.15,.9,.2,1) both}
@keyframes cityPostcard{
  0%{transform:perspective(900px) rotateY(105deg) rotateZ(18deg) scale(.4);opacity:0}
  48%{transform:perspective(900px) rotateY(-8deg) rotateZ(-5deg) scale(1.08);opacity:1}
  70%{transform:perspective(900px) rotateY(3deg) rotateZ(2deg) scale(.98)}
  100%{transform:perspective(900px) rotateY(0) rotateZ(0) scale(1.08)}
}

.fx-green-2{animation:greenGrow 4.3s cubic-bezier(.13,.9,.18,1) both;transform-origin:50% 100%}
@keyframes greenGrow{
  0%{transform:scale(.15,.05) translateY(50vh);filter:saturate(.4) blur(10px)}
  40%{transform:scale(1.08,1.28) translateY(-3vh);filter:saturate(1.4) blur(0)}
  65%{transform:scale(.96,1.02)}
  100%{transform:scale(1.12)}
}
.fx-green-3{animation:greenLeafSpin 4.3s cubic-bezier(.13,.9,.18,1) both}
@keyframes greenLeafSpin{
  0%{transform:scale(.2) rotate(-40deg) translate(-45vw,30vh);opacity:0;filter:hue-rotate(80deg)}
  48%{transform:scale(1.22) rotate(8deg) translate(3vw,-2vh);opacity:1;filter:hue-rotate(0)}
  72%{transform:scale(.98) rotate(-3deg)}
  100%{transform:scale(1.1) rotate(0)}
}

.fx-sea-2{animation:seaWave 4.3s ease-in-out both}
@keyframes seaWave{
  0%{transform:translateY(90vh) scale(1.5) rotate(-7deg);filter:blur(10px) saturate(1.6)}
  38%{transform:translateY(-8vh) scale(.94) rotate(3deg);filter:blur(0) saturate(1.3)}
  56%{transform:translateY(4vh) scale(1.06) rotate(-2deg)}
  74%{transform:translateY(-2vh) scale(1.02) rotate(1deg)}
  100%{transform:translateY(0) scale(1.12) rotate(0)}
}
.fx-sea-3{animation:seaIsland 4.3s cubic-bezier(.14,.88,.2,1) both}
@keyframes seaIsland{
  0%{transform:scale(2.4) rotate(14deg);opacity:0;filter:blur(16px)}
  35%{transform:scale(.72) rotate(-6deg);opacity:1;filter:blur(0)}
  58%{transform:scale(1.22) rotate(3deg)}
  76%{transform:scale(.98) rotate(-1deg)}
  100%{transform:scale(1.1) rotate(0)}
}

.flashPulse{animation:flashPulse .48s ease-out both}
@keyframes flashPulse{0%{filter:brightness(3)}100%{filter:brightness(1)}}
.screenShake{animation:screenShake .3s 2}
@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(-12px,6px)}50%{transform:translate(10px,-6px)}75%{transform:translate(-6px,-4px)}}
.wordSlam{animation:wordSlam .72s cubic-bezier(.08,1.45,.18,1) both}
@keyframes wordSlam{
  0%{transform:scale(5) rotate(12deg);opacity:0}
  55%{transform:scale(.82) rotate(-3deg);opacity:1}
  75%{transform:scale(1.12) rotate(1deg)}
  100%{transform:scale(1)}
}
.wordSide{animation:wordSide .75s cubic-bezier(.15,.9,.2,1) both}
@keyframes wordSide{from{transform:translateX(-120vw) skewX(-22deg);opacity:0}to{transform:none;opacity:1}}
.wordFlip{animation:wordFlip .8s cubic-bezier(.15,.9,.2,1) both}
@keyframes wordFlip{from{transform:perspective(700px) rotateX(100deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.spark{
  position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 0 24px #fff;animation:sparkFly 2s ease-out forwards;z-index:5
}
@keyframes sparkFly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}


@keyframes greenRise{
  from{transform:translateX(-50%) translateY(100%) scale(.7)}
  to{transform:translateX(-50%) translateY(-35%) scale(1.2)}
}
@keyframes seaRise{
  from{transform:translateY(100%) rotate(-5deg)}
  to{transform:translateY(-15%) rotate(0)}
}

@media(max-width:800px){
  .cards{grid-template-columns:1fr}
  .menuCard{min-height:170px}
  .choiceGrid{grid-template-columns:1fr 1fr}
  .choiceGrid .choice:last-child:nth-child(odd){grid-column:1/-1}
}

/* ===== 追加エフェクト ===== */
.speedLine{
  position:absolute;height:6px;width:48vw;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  opacity:.85;z-index:6;pointer-events:none;
  animation:speedLineMove 2.8s linear both;
}
@keyframes speedLineMove{
  from{transform:translateX(-130vw) skewX(-28deg)}
  to{transform:translateX(230vw) skewX(-28deg)}
}
.flashRing{
  position:absolute;left:50%;top:50%;width:20px;height:20px;
  border:14px solid #fff;border-radius:50%;transform:translate(-50%,-50%);
  z-index:7;pointer-events:none;animation:ringBlast 2.6s ease-out both;
}
@keyframes ringBlast{
  from{width:20px;height:20px;opacity:1}
  to{width:150vmax;height:150vmax;opacity:0}
}


/* ===== MAX 派手演出（素材なし） ===== */
.fxLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.flashFull{position:absolute;inset:0;background:#fff;animation:flashFull 1.2s ease-out both;z-index:20}
@keyframes flashFull{0%{opacity:1}35%{opacity:.95}100%{opacity:0}}

.radialBurst{
  position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%) scale(.04);
  background:repeating-conic-gradient(from 0deg,#fff 0 4deg,transparent 4deg 10deg);
  opacity:.35;animation:radialBurst 2.2s cubic-bezier(.15,.9,.2,1) both
}
@keyframes radialBurst{0%{transform:translate(-50%,-50%) scale(.03) rotate(0);opacity:.8}
70%{opacity:.28}100%{transform:translate(-50%,-50%) scale(1.2) rotate(35deg);opacity:0}}

.gridRush{
  position:absolute;inset:-20%;background:
  linear-gradient(#ffffff22 2px,transparent 2px),
  linear-gradient(90deg,#ffffff22 2px,transparent 2px);
  background-size:70px 70px;transform:perspective(700px) rotateX(65deg) translateY(25%);
  transform-origin:center bottom;animation:gridRush 3.5s linear both
}
@keyframes gridRush{from{background-position:0 0;filter:brightness(2)}to{background-position:0 560px;filter:brightness(1)}}

.scanBar{
  position:absolute;left:0;right:0;height:10vh;top:-12vh;
  background:linear-gradient(transparent,#ffffffaa,transparent);
  mix-blend-mode:screen;animation:scanDown 2.6s ease-in-out both
}
@keyframes scanDown{to{top:105vh}}

.cornerSlash{
  position:absolute;width:70vw;height:10vh;background:#fff8;transform:rotate(-25deg);
  animation:slashCross 2.3s ease-out both
}
@keyframes slashCross{from{left:-100vw;top:85vh}to{left:120vw;top:-20vh}}

.starPop{
  position:absolute;font-size:clamp(20px,4vw,60px);font-weight:1000;
  animation:starPop 2s cubic-bezier(.1,1.2,.25,1) both;text-shadow:0 0 18px #fff
}
@keyframes starPop{0%{transform:scale(0) rotate(-120deg);opacity:0}
55%{transform:scale(1.5) rotate(15deg);opacity:1}
100%{transform:scale(.9) rotate(0);opacity:0}}

.splitWrap{position:absolute;inset:0;z-index:2}
.splitPiece{position:absolute;background-size:200% 200%;background-repeat:no-repeat}
.splitTL{left:0;top:0;width:50%;height:50%;background-position:0 0;animation:pieceTL 2.4s cubic-bezier(.12,.9,.18,1) both}
.splitTR{right:0;top:0;width:50%;height:50%;background-position:100% 0;animation:pieceTR 2.4s cubic-bezier(.12,.9,.18,1) both}
.splitBL{left:0;bottom:0;width:50%;height:50%;background-position:0 100%;animation:pieceBL 2.4s cubic-bezier(.12,.9,.18,1) both}
.splitBR{right:0;bottom:0;width:50%;height:50%;background-position:100% 100%;animation:pieceBR 2.4s cubic-bezier(.12,.9,.18,1) both}
@keyframes pieceTL{from{transform:translate(-80vw,-70vh) rotate(-25deg) scale(.45);opacity:0}to{transform:none;opacity:1}}
@keyframes pieceTR{from{transform:translate(80vw,-70vh) rotate(25deg) scale(.45);opacity:0}to{transform:none;opacity:1}}
@keyframes pieceBL{from{transform:translate(-80vw,70vh) rotate(25deg) scale(.45);opacity:0}to{transform:none;opacity:1}}
@keyframes pieceBR{from{transform:translate(80vw,70vh) rotate(-25deg) scale(.45);opacity:0}to{transform:none;opacity:1}}

.shutterWrap{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:repeat(6,1fr)}
.shutter{
  background-size:600% 100%;background-repeat:no-repeat;
  transform:translateY(var(--dir));animation:shutterIn 2.2s cubic-bezier(.12,.9,.2,1) both
}
@keyframes shutterIn{to{transform:translateY(0)}}

.circleReveal{
  position:absolute;inset:0;background-size:cover;background-position:center;
  clip-path:circle(0% at 50% 50%);animation:circleReveal 2.4s cubic-bezier(.1,.9,.18,1) both;z-index:2
}
@keyframes circleReveal{to{clip-path:circle(75% at 50% 50%)}}

.flipWall{
  position:absolute;inset:0;background-size:cover;background-position:center;
  transform-origin:center;animation:flipWall 2.7s cubic-bezier(.12,.9,.2,1) both;z-index:2
}
@keyframes flipWall{
  0%{transform:perspective(900px) rotateX(-90deg) scale(.55);opacity:0}
  55%{transform:perspective(900px) rotateX(10deg) scale(1.08);opacity:1}
  100%{transform:perspective(900px) rotateX(0) scale(1.12)}
}

.tunnelZoom{
  position:absolute;inset:-15%;background-size:cover;background-position:center;
  animation:tunnelZoom 3s cubic-bezier(.1,.85,.2,1) both;z-index:2
}
@keyframes tunnelZoom{
  0%{transform:scale(3.8) rotate(12deg);filter:blur(20px) brightness(2)}
  45%{transform:scale(.82) rotate(-4deg);filter:blur(0) brightness(1.1)}
  70%{transform:scale(1.22) rotate(2deg)}
  100%{transform:scale(1.08) rotate(0)}
}

.bounceFrame{
  position:absolute;inset:7%;background-size:cover;background-position:center;border:10px solid #fff;
  box-shadow:0 0 0 12px #0005,0 24px 50px #0008;
  animation:bounceFrame 2.7s cubic-bezier(.08,1.35,.2,1) both;z-index:2
}
@keyframes bounceFrame{
  0%{transform:translateY(-120vh) rotate(-18deg) scale(.4)}
  55%{transform:translateY(5vh) rotate(5deg) scale(1.1)}
  72%{transform:translateY(-2vh) rotate(-2deg) scale(.98)}
  100%{transform:none}
}

.textMega{
  font-size:clamp(56px,10vw,140px)!important;font-weight:1000;line-height:1.05;
  text-shadow:0 10px 24px #000,0 0 12px #fff6
}
.textOutline{
  -webkit-text-stroke:3px #fff;color:#111;text-shadow:8px 8px 0 #ffcf4a,12px 12px 0 #0008
}
.textNeon{
  color:#fff;text-shadow:0 0 8px #fff,0 0 20px #51c9ff,0 0 40px #0aa9ff,0 0 70px #0878ff
}
.textNature{
  color:#efffe8;text-shadow:0 0 8px #fff,0 0 22px #70d65c,0 8px 18px #153d20
}
.textSea{
  color:#fff;text-shadow:0 0 10px #fff,0 0 26px #5edbff,0 8px 20px #004b78
}

.popInEach span{display:inline-block;animation:charPop 1.5s cubic-bezier(.08,1.4,.18,1) both}
@keyframes charPop{0%{transform:translateY(-90vh) rotate(-25deg) scale(.2);opacity:0}
65%{transform:translateY(14px) rotate(5deg) scale(1.2);opacity:1}100%{transform:none}}

.ripple{
  position:absolute;border:8px solid #fff;border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);animation:ripple 2.5s ease-out both;z-index:8
}
@keyframes ripple{from{width:10px;height:10px;opacity:1}to{width:130vmax;height:130vmax;opacity:0}}

.confetti{position:absolute;width:14px;height:34px;z-index:12;animation:confettiFall 3.8s linear both}
@keyframes confettiFall{from{transform:translateY(-20vh) rotate(0)}to{transform:translateY(120vh) rotate(720deg)}}

.impactBar{
  position:absolute;left:-10%;right:-10%;top:50%;height:18vh;transform:translateY(-50%) rotate(-3deg);
  background:#fffdd;box-shadow:0 0 45px #fff;animation:impactBar 1.8s ease-out both;z-index:4
}
@keyframes impactBar{from{transform:translateY(-50%) rotate(-3deg) scaleX(0)}to{transform:translateY(-50%) rotate(-3deg) scaleX(1)}}

.bgPulse{animation:bgPulse 2.4s ease-in-out both}

function applyReadings(root){
  if(!root) return;
  const skipTags=new Set(["SCRIPT","STYLE","TEXTAREA","INPUT","OPTION"]);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const targets=[];
  while(walker.nextNode()){
    const n=walker.currentNode;
    const p=n.parentElement;
    if(!p || skipTags.has(p.tagName)) continue;
    if(p.closest(".readingBlock") || p.closest(".landmarkChar") || p.closest(".landmarkKana")) continue;
    const raw=n.nodeValue;
    const core=raw.trim();
    if(core && READINGS[core]) targets.push([n,raw,core]);
  }
  targets.forEach(([n,raw,core])=>{
    if(!n.parentNode) return;
    const lead=raw.slice(0,raw.indexOf(core));
    const trail=raw.slice(raw.indexOf(core)+core.length);
    const frag=document.createDocumentFragment();
    if(lead) frag.appendChild(document.createTextNode(lead));
    const wrap=document.createElement("span");
    wrap.className="readingBlock";
    const main=document.createElement("span");
    main.className="readingMain";
    main.textContent=core;
    const kana=document.createElement("span");
    kana.className="readingKana";
    kana.textContent=READINGS[core];
    wrap.append(main,kana);
    frag.appendChild(wrap);
    if(trail) frag.appendChild(document.createTextNode(trail));
    n.parentNode.replaceChild(frag,n);
  });
}

function goHome(){

function refreshHome(){
  ["city","green","sea"].forEach(p=>{

    st.textContent=state.completed[p]?"できた！ ✓":"まだ";
  });
  const all=Object.values(state.completed).every(Boolean);

function shuffledIndices(n){
  const a=[...Array(n).keys()];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function ensureOrder(part,qi){
  const q=DATA[part].questions[qi];
  if(!state.order[part][qi]) state.order[part][qi]=shuffledIndices(q.options.length);
  return state.order[part][qi];
}

function openPart(part){
  state.currentPart=part;
  state.q=0;
  state.freeMode=false;
  showOnly("builder");
  renderQuestion();
}

function startFreeMode(){
  state.freeMode=true;
  state.freeMovieReady=false;
  state.currentPart="city";
  state.q=0;
  state.freeText={city:["","",""],green:["","",""],sea:["","",""]};
  state.effects=cloneDefaultEffects();
  state.answers={city:[null,null,null],green:[null,null,null],sea:[null,null,null]};
  state.order={city:[null,null,null],green:[null,null,null],sea:[null,null,null]};
  showOnly("builder");
  renderQuestion();
}

function renderQuestion(){
  const p=state.currentPart;
  const part=DATA[p];
  const q=part.questions[state.q];
  document.getElementById("partTitle").textContent=part.title;
  document.getElementById("modeLabel").textContent=state.freeMode?"じぶんのことばでつくる":"しゃしんを えらぼう";
  document.getElementById("questionText").textContent=q.text;
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",i===state.q));

  const box=document.getElementById("choices");
  box.innerHTML="";
  box.className="choiceGrid"+(q.type==="text"?" two":"");

  const order=ensureOrder(p,state.q);
  order.forEach(i=>{
    const o=q.options[i];
    const b=document.createElement("button");
    b.className="choice "+(q.type==="text"?"textChoice":"");
    if(state.answers[p][state.q]===i)b.classList.add("selected");
    if(q.type==="image"){
      const img=document.createElement("img");
      img.src=o.img; img.alt=o.label;
      img.onerror=()=>{img.style.display="none";};
      b.appendChild(img);
      const ss=document.createElement("div");
      ss.textContent=o.label;b.appendChild(ss);
    }else{
      b.textContent=o.label;
    }
    b.onclick=()=>{
      state.answers[p][state.q]=i;
      renderQuestion();
    };
    box.appendChild(b);
  });

  const freeBox=document.getElementById("freeTextBox");
  freeBox.classList.toggle("hidden",!state.freeMode);
  if(state.freeMode){
    const input=document.getElementById("freeText");
    input.value=state.freeText[p][state.q]||"";
    input.oninput=()=>state.freeText[p][state.q]=input.value;

    const effectSelect=document.getElementById("effectSelect");
    const effectDesc=document.getElementById("effectDesc");
    effectSelect.innerHTML=Object.entries(EFFECTS)
      .map(([id,e])=>`<option value="${id}">${e.name}　（${e.kana}）</option>`).join("");
    effectSelect.value=state.effects[p][state.q] || DEFAULT_EFFECTS[p][state.q];
    effectDesc.textContent=EFFECTS[effectSelect.value].desc;
    effectSelect.onchange=()=>{
      state.effects[p][state.q]=effectSelect.value;
      effectDesc.textContent=EFFECTS[effectSelect.value].desc;
      applyReadings(effectDesc);
    };
  }

  document.getElementById("prevBtn").style.visibility=state.q===0?"hidden":"visible";
  document.getElementById("nextBtn").textContent=state.q===2?"▶ ムービーをみる":"つぎへ →";
  applyReadings(document.getElementById("builder"));
}

function prevQuestion(){
  if(state.q>0){state.q--;renderQuestion();}
}
function nextQuestion(){
  const p=state.currentPart;
  if(state.answers[p][state.q]===null){
    pulseMessage("１つえらびましょう");
    return;
  }
  if(state.q<2){state.q++;renderQuestion();return;}
  playPartMovie(p);
}
function pulseMessage(text){
  const old=document.querySelector(".tempMsg");

  d.style.cssText="position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:50;background:#ffef7a;padding:14px 24px;border-radius:999px;font-size:26px;font-weight:900;box-shadow:0 6px 18px #0003";

function renderEffect(effectId,part,qi,o,custom){
  if(!o.img){

  if(effectId==="split"){
    splitImageScene(o.img,custom,o.label,cls);
    later(()=>{addFlashFull();addRadialBurst();addStars(12);},520);
  }else if(effectId==="shutter"){
    shutterImageScene(o.img,custom,o.label,cls);
    later(()=>{addSpeedLines(12);addSlash();addScan();},420);
  }else if(effectId==="tunnel"){
    tunnelImageScene(o.img,custom,o.label,cls);
    later(()=>{addFlashRing();addStars(14);addRadialBurst();},760);
  }else if(effectId==="impact"){
    imageScene(o.img,custom,o.label,"fx-city-1","wordSlam");
    later(()=>{addFlashFull();addSparks(30);addStars(14);},430);
  }else if(effectId==="circle"){

    later(()=>{addRipples(3);addSparks(24);addRadialBurst();},650);
  }else if(effectId==="bounce"){
    bounceImageScene(o.img,custom,o.label,cls);
    later(()=>{addFlashRing();addStars(18);addSlash();},620);
  }else if(effectId==="wave"){
    imageScene(o.img,custom,o.label,"fx-sea-2","waveText");
    later(()=>{addRipples(4);addSparks(24);addSpeedLines(5);},520);

function playPartMovie(part){
  stopMovie();showOnly("movie");
  const d=DATA[part];
  const ans=state.answers[part];
  const wrongIndex=ans.findIndex((choiceIndex,qi)=>!d.questions[qi].options[choiceIndex].ok);

  textScene(d.title,"えらんだもので ムービーをつくります",d.color);
  later(()=>playPartScene(part,0,wrongIndex),1400);
}

function playPartScene(part,qi,wrongIndex){
  const d=DATA[part], q=d.questions[qi], oi=state.answers[part][qi], o=q.options[oi];
  const custom=state.freeMode ? (state.freeText[part][qi]||q.text) : q.text;
  renderEffect(getEffectId(part,qi),part,qi,o,custom);

  later(()=>{
    if(qi===wrongIndex){
      playError(part,qi,o,q);
      return;
    }
    if(qi<2){
      playTransition(part,qi);
      const transitionWait=(part==="city" && qi===1)?2600:900;
      later(()=>playPartScene(part,qi+1,wrongIndex),transitionWait);
    }else{
      finishPart(part);
    }
  },3200);
}

    movieHTML(`
      <div style="position:absolute;inset:0;background:linear-gradient(#9cecff,#006b9f)"></div>
      <div class="movieText textMega textSea dropIn">それだけじゃ ないですよ</div>
    `); addSpeedLines(8); addFlashRing();
  }
}
function playError(part,qi,o,q){
  movieHTML(`
    ${o.img?`<img class="bgImage" src="${o.img}" alt="">`:""}
    <div class="overlay"></div>
    <div class="movieText errorText">エラー！<span class="movieSub">${q.errorMessage || "これは 東京都じゃないみたい！"}</span></div>
  `,"glitch");
  later(()=>{
    movieHTML(`
      <div style="position:absolute;inset:0;background:#210707"></div>
      <div class="movieText">
        なおしてみよう！
        <span class="movieSub">${o.label}</span>
        <br><br>
        <button class="mainBtn" onclick="retryWrong(${qi})">もどって なおす</button>
      </div>
    `);
  },1500);
}

function retryWrong(qi){
  stopMovie();showOnly("builder");
  state.q=qi;
  state.order[state.currentPart][qi]=null;
  renderQuestion();
}

function nextFreePart(part){
  stopMovie();
  const next = part==="city" ? "green" : part==="green" ? "sea" : null;
  if(next){
    state.currentPart=next;
    state.q=0;
    showOnly("builder");
    renderQuestion();
  }else{
    state.freeMovieReady=true;
    playFreeFinalMovie();
  }
}

function finishPart(part){
  state.completed[part]=true;
  const d=DATA[part];

  if(state.freeMode){
    const nextLabel = part==="city"
      ? "② 東京の緑へ"
      : part==="green"
        ? "③ 東京の海へ"
        : "▶ 3つをつなげてみる";
    movieHTML(`
      <div class="completeBurst">
        <div class="zoomBurst">
          <h2>${d.title}<br>できた！</h2>
          <p style="font-size:26px">ことばと えんしゅつも えらびました。</p>
          <button class="mainBtn" onclick="nextFreePart('${part}')">${nextLabel}</button>
          <button class="smallBtn" onclick="goHome()">🏠 ホームへ</button>
        </div>
      </div>
    `);
  }else{
    movieHTML(`
      <div class="completeBurst">
        <div class="zoomBurst">
          <h2>${d.title}<br>できた！</h2>
          <p style="font-size:26px">えらんだものが ムービーになりました。</p>
          <button class="mainBtn" onclick="goHome()">🏠 ホームへ</button>
        </div>
      </div>
    `);
  }
  addSparks(34);
}

function skipMovie(){
  if(state.currentPart && !document.getElementById("movie").classList.contains("hidden")){
    stopMovie();
    if(state.currentPart==="final"){goHome();}
    else finishPart(state.currentPart);
  }
}


function playFreeFinalMovie(){
  if(!state.freeMovieReady) return;
  state.freeMode=true;
  playFinalMovie();
}

function playFinalMovie(){
  stopMovie();
  state.currentPart="final";
  showOnly("movie");
  document.getElementById("movieControls").style.display="flex";

  // 最終版オープニング
  movieHTML(`
    <div style="position:absolute;inset:0;background:
      radial-gradient(circle at 30% 30%,#5ed0ff55,transparent 25%),
      radial-gradient(circle at 70% 35%,#8ee88455,transparent 26%),
      radial-gradient(circle at 50% 75%,#ffd15a55,transparent 28%),
      #101827"></div>
    <div class="movieText zoomBurst">
      とうきょうって……
      <span class="movieSub">どんなところ？</span>
    </div>
  `);
  addSparks(24);

  later(()=>{
    movieHTML(`
      <div style="position:absolute;inset:0;background:#111"></div>
      <div class="movieText heroWord wordSlam" style="font-size:clamp(58px,10vw,135px)!important">
        ゆうめいなものが<br>たくさんあります！
      </div>
    `);
  },1200);

  later(()=>playFinalPart("city",0),2500);
}

function playFinalPart(part,qi){
  const d=DATA[part];
  const q=d.questions[qi];
  const oi=state.answers[part][qi];
  const o=q.options[oi];
  const custom=state.freeMode ? (state.freeText[part][qi]||q.text) : q.text;
  renderEffect(getEffectId(part,qi),part,qi,o,custom);

  later(()=>{
    if(qi<2){
      playFinalMiniTransition(part,qi);
      const transitionWait=(part==="city" && qi===1)?2600:900;
      later(()=>playFinalPart(part,qi+1),transitionWait);
    }else{
      if(part==="city"){
        playBridgeCityToGreen();
        later(()=>playFinalPart("green",0),2600);
      }else if(part==="green"){
        playBridgeGreenToSea();
        later(()=>playFinalPart("sea",0),2600);
      }else{
        playBridgeSeaToEnding();
        later(()=>finalEnding(),2600);
      }
    }
  },3200);
}

function playFinalMiniTransition(part,qi){
  // 各ショートムービー内の短いつなぎ
  if(part==="city" && qi===0){
    movieHTML(`
      <div class="cityFlash" style="position:absolute;inset:0"></div>
      <div class="movieText heroWord flyRight" style="font-size:clamp(54px,9vw,120px)!important">とうきょうといえば だいとかい！</div>
    `);
  }else if(part==="city"){
    movieHTML(`
      <div class="landmarkStage">
        <div class="landmarkBeam b1"></div>
        <div class="landmarkBeam b2"></div>
        <div class="landmarkUnderline"></div>
        <div class="movieText landmarkLine">
          <span class="landmarkChar">ビ</span><span class="landmarkChar">ル</span><span class="landmarkChar">だ</span><span class="landmarkChar">け</span><span class="landmarkChar">で</span><span class="landmarkChar">は</span><span class="landmarkChar"> </span><span class="landmarkChar">あ</span><span class="landmarkChar">り</span><span class="landmarkChar">ま</span><span class="landmarkChar">せ</span><span class="landmarkChar">ん</span>
        </div>
        <div class="landmarkKana">とうきょうのめいしょへ！</div>
      </div>
    `);
  }else if(part==="green" && qi===0){
    movieHTML(`
      <div class="greenFlash" style="position:absolute;inset:0"></div>
      <div class="movieText zoomBurst" style="color:#12350e;text-shadow:none">やまへ GO！</div>
    `);
  }else if(part==="green"){
    movieHTML(`
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,#b9ef9f,#efffdc)"></div>
      <div class="movieText flyLeft" style="color:#174014;text-shadow:none">つぎは こうえん！</div>
    `);
  }else if(part==="sea" && qi===0){
    movieHTML(`
      <div class="seaFlash" style="position:absolute;inset:0"></div>
      <div class="movieText waveText">うみを みてみよう！</div>
    `);
  }else{
    movieHTML(`
      <div style="position:absolute;inset:0;background:linear-gradient(#8fe4ff,#066aa5)"></div>
      <div class="movieText dropIn">それだけじゃ ないですよ</div>
    `);
  }
}

function playBridgeCityToGreen(){
  movieHTML(`
    <div style="position:absolute;inset:0;background:linear-gradient(#2a2d37,#101218)"></div>
    <div class="movieText zoomBurst" style="font-size:clamp(40px,7vw,90px)">
      とうきょうは<br>とかいだけじゃない！
    </div>
    <div style="position:absolute;left:50%;bottom:-20%;width:130vw;height:55vh;border-radius:50%;
      transform:translateX(-50%);background:#67b95f;animation:greenRise 1.5s ease forwards"></div>
  `);
  addSparks(24); addRadialBurst(); addSlash(); addFlashFull();
}

function playBridgeGreenToSea(){
  // 緑が風で流れ、その下から海が現れる
  movieHTML(`
    <div style="position:absolute;inset:0;background:linear-gradient(#c8f6bd,#6fbe62)"></div>
    <div class="movieText flyLeft" style="color:#173a16;text-shadow:none;font-size:clamp(42px,7vw,92px)">
      しぜんのつぎは……
    </div>
    <div style="position:absolute;left:-10%;right:-10%;bottom:-25%;height:65vh;
      background:#149ed3;border-radius:50% 50% 0 0/20% 20% 0 0;
      animation:seaRise 1.5s ease forwards"></div>
    <div style="position:absolute;left:0;right:0;bottom:16%;font-size:clamp(46px,8vw,110px);
      font-weight:1000;text-align:center;animation:waveText 1s .45s both">うみもある！</div>
  `);
  addRipples(4); addSpeedLines(8); addFlashRing();
}

function playBridgeSeaToEnding(){
  // 海から全体まとめへ
  movieHTML(`
    <div style="position:absolute;inset:0;background:linear-gradient(#65d5ff,#0574ad)"></div>
    <div class="movieText zoomBurst">
      とかいも！
      <span class="movieSub">みどりも！　うみも！</span>
    </div>
  `);
  addSparks(34); addRadialBurst(); addStars(18); addFlashFull();
}
function finalEnding(){
  state.finalWatched=true;
  movieHTML(`
    <div class="completeBurst">
      <div class="radialBurst"></div>
      <div class="zoomBurst" style="position:relative;z-index:10">
        <div style="font-size:clamp(30px,5vw,64px);font-weight:1000">とかいも　みどりも　うみもある</div>
        <h2 class="heroWord wordSlam" style="font-size:clamp(64px,12vw,160px)!important">ぜんぶとうきょうと！</h2>
        <div style="font-size:clamp(28px,4vw,54px);font-weight:1000">東京都</div>
        <br>
        <button class="mainBtn" onclick="${state.freeMode?'playFreeFinalMovie()':'playFinalMovie()'}">▶ もういちどみる</button>
        <button class="smallBtn" onclick="goHome()">🏠 ホーム</button>
      </div>
    </div>
  `);
  addConfetti(70);
  addSparks(42);
  addStars(26);
  addFlashRing();
  addRadialBurst();
}

refreshHome();
applyReadings(document.getElementById("app"));
</script>
</body>
</html>
